<script>
// OpenStore shared parsing/validation helpers. No dependencies, no remote services.
const STORAGE_KEY = 'openstore-v1';

function safeHttpsUrl(value, { allowLocal = false } = {}) {
  if (typeof value !== 'string' || value.trim().length === 0) return null;
  try {
    const url = new URL(value.trim());
    if (url.protocol === 'https:') return url.toString();
    if (allowLocal && url.protocol === 'http:' && ['localhost','127.0.0.1'].includes(url.hostname)) return url.toString();
  } catch { /* invalid */ }
  return null;
}

function makeSideStoreInstallUrl(ipaURL) {
  const verified = safeHttpsUrl(ipaURL);
  if (!verified) throw new Error('Provide an HTTPS direct link to the IPA file.');
  return 'sidestore://install?url=' + encodeURIComponent(verified);
}

function makeSideStoreSourceUrl(sourceURL) {
  const verified = safeHttpsUrl(sourceURL);
  if (!verified) throw new Error('Provide an HTTPS URL to an AltStore source JSON file.');
  return 'sidestore://source?url=' + encodeURIComponent(verified);
}

const limited = (input, length = 300) => String(input ?? '').trim().slice(0,length);
function parseAltSource(raw, origin = '') {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.apps)) throw new Error('Not an AltStore source: the JSON must contain an apps array.');
  if (raw.apps.length > 1000) throw new Error('This source has more than 1,000 apps; please use a smaller source.');
  const apps = raw.apps.map((item, index) => {
    if (!item || typeof item !== 'object') return null;
    const newest = Array.isArray(item.versions) ? item.versions[0] : null;
    const url = safeHttpsUrl(newest?.downloadURL || item.downloadURL || '');
    const icon = safeHttpsUrl(item.iconURL || '');
    const name = limited(item.name, 100);
    if (!name) return null;
    return {
      id: limited(item.bundleIdentifier || `${origin || 'file'}:${index}`, 250),
      name,
      developer: limited(item.developerName, 100) || 'Unknown developer',
      subtitle: limited(item.subtitle || item.localizedDescription || '', 280),
      version: limited(newest?.version || item.version || '', 32),
      icon,
      url,
      website: safeHttpsUrl(item.website || '')
    };
  }).filter(Boolean);
  return {
    title: limited(raw.name, 100) || 'Untitled source',
    subtitle: limited(raw.subtitle || raw.description || '', 250),
    apps
  };
}

function makeInitialState() {
  return {sources: [], manualApps: [], favoriteKeys: [], theme: 'dark'};
}

function loadState(storage) {
  try {
    const saved = JSON.parse(storage.getItem(STORAGE_KEY));
    if (!saved || typeof saved !== 'object') return makeInitialState();
    return {
      sources: Array.isArray(saved.sources) ? saved.sources.slice(0,100) : [],
      manualApps: Array.isArray(saved.manualApps) ? saved.manualApps.slice(0,100) : [],
      favoriteKeys: Array.isArray(saved.favoriteKeys) ? saved.favoriteKeys.slice(0,1000) : [],
      theme: saved.theme === 'light' ? 'light' : 'dark'
    };
  } catch { return makeInitialState(); }
}

function collectApps(state) {
  return [
    ...(state.manualApps || []).map(app=>({...app, sourceName:'My apps', key:`manual:${app.id}`})),
    ...(state.sources || []).flatMap(src => (src.apps||[]).map((app,idx)=>({
      ...app, sourceName:src.title, key:`source:${src.id}:${app.id}:${idx}`
    })))
  ];
}

function filenameFromURL(url) {
  try { return decodeURIComponent(new URL(url).pathname.split('/').pop() || 'app.ipa'); }
  catch { return 'app.ipa'; }
}

let tab = 'explore';
let filter = 'all';
let search = '';
let selectedIPA = null;
let toastTimer;

const esc = input => String(input ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name, size='20') => {
  const paths = {
    plus:'<path d="M12 5v14M5 12h14"/>',
    box:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/>',

async function importOnlineSource(input){
 const url=safeHttpsUrl(input);if(!url)throw new Error('The source URL must begin with https://');
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),13000);
 try {
  const response=await fetch(url,{signal:controller.signal,cache:'no-cache',credentials:'omit'});
  if (!response.ok) throw new Error('Source server returned HTTP '+response.status);
  const text=await response.text();if(text.length>2_500_000)throw new Error('Source JSON is too large (over 2.5 MB).');
  return { ...parseAltSource(JSON.parse(text),url),url };
 } catch(error){
  if(error.name==='AbortError')throw new Error('Source timed out. Try importing its JSON file from Files.');
  if(error instanceof TypeError)throw new Error('Safari could not fetch this source (likely CORS). Download its JSON in Safari and import the file instead.');
  throw error;
 }finally{clearTimeout(timeout);}
}

 else{ if(state.sources.length>=100)throw new Error('Maximum of 100 sources reached.');state.sources.unshift({...data,id}); }
 persist();closeModal();render();toast(`${data.title}: ${data.apps.length} app${data.apps.length===1?'':'s'} loaded`);
}

async function handleAction(btn){
 const action=btn.dataset.action;const key=btn.dataset.key?decodeURIComponent(btn.dataset.key):null;
 const id=btn.dataset.id?decodeURIComponent(btn.dataset.id):null;
 if(action==='close-modal')return closeModal();
 if(action==='pick-ipa')return ipaPicker.click();
 if(action==='pick-json')return jsonPicker.click();
 if(action==='pick-state')return statePicker.click();
 if(action==='open-source-modal')return sourceModal();
 if(action==='add-manual')return manualModal();
 if(action==='url-modal')return urlModal();
 if(action==='help')return selectTab('install');
 if(action==='docs-altstore')return openLink('https://faq.altstore.io/developers/make-a-source');
 if(action==='docs-apple')return openLink(appleDocs);
 if(action==='sidestore-docs')return openLink(sideDocs);
 if(action==='sideinstaller-site')return openLink(sideInstall);
 if(action==='melonx')return openLink(melonxReleases);
 if(action==='clear-ipa'){selectedIPA=null;ipaPicker.value='';render();return;}
 if(action==='share-ipa')return shareIPA();
 if(action==='favorite'){
  state.favoriteKeys=state.favoriteKeys.includes(key)?state.favoriteKeys.filter(x=>x!==key):[...state.favoriteKeys,key];persist();render();return;
 }
 if(action==='detail')return showDetail(key);
 if(action==='install-app'||action==='download-app'||action==='app-website'){
  const app=apps().find(a=>a.key===key);if(!app)return toast('App no longer found.');
  if(action==='install-app')return openSideStore(app.url);
  if(action==='download-app')return openLink(app.url);
  return openLink(app.website);
 }
 if(action==='delete-app'){
  const obj=apps().find(x=>x.key===key);
  if(obj && confirm(`Remove ${obj.name} from your links?`)){state.manualApps=state.manualApps.filter(a=>'manual:'+a.id!==key);persist();closeModal();render();}return;
 }
 if(action==='refresh-source'){
  const src=state.sources.find(x=>x.id===id);if(!src?.url)return;
  toast('Refreshing '+src.title+'…');try{const result=await importOnlineSource(src.url);addSource(result,id);}catch(err){toast(err.message);}return;
 }
 if(action==='remove-source'){
  const src=state.sources.find(x=>x.id===id);if(src&&confirm(`Remove ${src.title} and its apps?`)){state.sources=state.sources.filter(s=>s.id!==id);persist();render();toast('Source removed');}return;
 }
 if(action==='send-source'){
  const src=state.sources.find(x=>x.id===id);if(src?.url)openSourceInSideStore(src.url);return;
 }
 if(action==='export-state')return downloadJSON({...state,app:'openstore',schema:1},'openstore-library.json');
 if(action==='reset-state'&&confirm('Remove all saved apps, sources and favorites?')){localStorage.removeItem(STORAGE_KEY);state=loadState(localStorage);render();toast('Library cleared');}
}

   const existing=state.sources.find(s=>s.url===src.url);
   addSource(src,existing?.id);
  } else if(form.id==='manualForm'){
   const url=safeHttpsUrl(data.url);if(!url)throw new Error('IPA URL must use HTTPS.');
   const name=String(data.name||'').trim();if(!name)throw new Error('Please provide an app name.');
   const iconUrl = data.icon ? safeHttpsUrl(data.icon) : null;
   if(data.icon&&!iconUrl)throw new Error('Icon URL must use HTTPS.');
   state.manualApps.unshift({id:'app-'+Date.now().toString(36),name:name.slice(0,100),developer:String(data.developer||'Personal').trim().slice(0,100),subtitle:'Personal IPA link',url,icon:iconUrl,version:'',website:null});persist();closeModal();render();toast('App link added');
  } else if(form.id==='ipaUrlForm'){
   const url=safeHttpsUrl(data.url);if(!url)throw new Error('Provide a valid HTTPS IPA link.');closeModal();openSideStore(url);
  }
 }catch(err){toast(err.message||'An error occurred.');}finally{progress=false;if(submit)submit.disabled=false;}
});
ipaPicker.addEventListener('change',()=>{
 const file=ipaPicker.files?.[0];if(!file)return;
 if(!file.name.toLowerCase().endsWith('.ipa'))return toast('Please choose an .ipa file.');
 selectedIPA=file;selectTab('install');toast(`${file.name} ready to share`);
});
jsonPicker.addEventListener('change',async()=>{
 const file=jsonPicker.files?.[0];if(!file)return;
 try{if(file.size>2_500_000)throw new Error('Source JSON must be below 2.5 MB.');
   const parsed=parseAltSource(JSON.parse(await file.text()),file.name);addSource({...parsed,url:null});
 }catch(err){toast(err.message);}finally{jsonPicker.value='';}
});
statePicker.addEventListener('change',async()=>{
 const file=statePicker.files?.[0];if(!file)return;
 try{
  const json=JSON.parse(await file.text());if(json.app!=='openstore'||json.schema!==1)throw new Error('This is not an OpenStore backup.');
  const recovered={sources:[],manualApps:[],favoriteKeys:[],theme:json.theme==='light'?'light':'dark'};
  if(Array.isArray(json.sources))for(const src of json.sources.slice(0,100)){
   if(!src||typeof src!=='object')continue;
   const clean=parseAltSource({name:src.title,subtitle:src.subtitle,apps:(src.apps||[]).map(a=>({name:a.name,bundleIdentifier:a.id,developerName:a.developer,subtitle:a.subtitle,iconURL:a.icon,website:a.website,versions:[{version:a.version,downloadURL:a.url}]}))},'backup');
   recovered.sources.push({...clean,id:'src-'+crypto.randomUUID(),url:safeHttpsUrl(src.url)});
  }
  if(Array.isArray(json.manualApps))for(const a of json.manualApps.slice(0,100)){
   const url=safeHttpsUrl(a.url);if(url&&a.name)recovered.manualApps.push({id:'app-'+crypto.randomUUID(),name:String(a.name).slice(0,100),url,developer:String(a.developer||'Personal').slice(0,100),subtitle:'Personal IPA link',icon:safeHttpsUrl(a.icon),version:''});
  }
  state=recovered;persist();render();toast('Library backup imported. Favorites may need to be reselected.');
 }catch(err){toast(err.message);}finally{statePicker.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeModal();});
window.addEventListener('hashchange',()=>{const val=location.hash.slice(1);if(['explore','sources','install','signer','device','settings'].includes(val)&&val!==tab){tab=val;render();}});
if(['explore','sources','install','signer','device','settings'].includes(location.hash.slice(1)))tab=location.hash.slice(1);

// ===== OpenStore 2 - self-hosted signing service =====
// Signing is NOT performed by GitHub Pages. Files are submitted only to the configured backend.
let signerResult = null;
let signerSources = [];
let signerBusy = false;
let signerBackend = localStorage.getItem('openstore-signer-backend') || '';
const signerErr = (msg) => {
 const output = document.getElementById('signer-status');
 if (output) output.textContent = msg;
 toast(msg);
};
function signerUrl(value) {
 const url = safeHttpsUrl(String(value||''), {allowLocal:true});
 if(!url)throw new Error('Use the HTTPS URL of your own signer backend.');
 return url.replace(/\/$/,'');
}
function renderSigner() {
 return `<header class="page-head"><h1>Sign & install</h1><p>Sign IPAs using a matching certificate and provisioning profile, including authorized publicly shared profiles.</p></header>
 <div class="warning"><b>A signing server is required.</b> This site is hosted on GitHub Pages and cannot sign by itself. Configure your own backend (see the OpenStore README). Shared enterprise certificates may be revoked and are not a reliable replacement for free Apple Account signing. Do not upload sensitive personal certificates to a server you don't control.</div>
 <div class="section-heading"><h2>1. Your signer</h2></div>
 <section class="signer-panel">
 <label for="signerHost">Signing server URL (HTTPS)</label><input type="url" id="signerHost" value="${esc(signerBackend)}" placeholder="https://your-signer.example.com" autocomplete="url" spellcheck="false">
 <label for="signerToken">Private server access key</label><input type="password" id="signerToken" placeholder="Never put this key in public GitHub files" autocomplete="off"><p class="tiny">Only the server URL is saved locally. Your access key, IPA and certificate are never saved in browser storage.</p>
 <div class="signer-buttons"><button class="btn secondary small" type="button" data-action="check-signer">${icon('shield')} Test connection</button></div>
 </section>
 <div class="section-heading"><h2>2. Select signing files</h2></div>
 <section class="signer-panel"><p class="tiny">Use a valid P12 private-key certificate and a provisioning profile that authorizes the IPA's bundle ID and your device.</p>
 <label for="signerIPA">IPA file</label><input id="signerIPA" type="file" accept=".ipa,application/octet-stream">
 <label for="signerP12">Signing certificate (.p12/.pfx)</label><input id="signerP12" type="file" accept=".p12,.pfx">
 <label for="signerProfile">Provisioning profile (.mobileprovision)</label><input id="signerProfile" type="file" accept=".mobileprovision">
 <label for="signerPassword">Certificate password</label><input type="password" id="signerPassword" placeholder="P12 password (can be empty)" autocomplete="off">
 </section>
 <div class="section-heading"><h2>3. Public certificate source (optional)</h2></div>
 <section class="signer-panel"><p class="tiny">A certificate source JSON can list HTTPS download links to a P12 and its matching provisioning profile. OpenStore fetches files in your Safari session; source servers must support CORS. Never install untrusted configuration profiles or bypass certificate verification.</p>
 <label for="certificateSource">Certificate source URL</label><input id="certificateSource" type="url" placeholder="https://example.org/openstore-certs.json">
 <div class="signer-buttons"><button class="btn small secondary" data-action="load-certs" type="button">${icon('globe')} Load source</button></div>
 <label for="certChoice">Available certificates</label><select id="certChoice"><option value="">${signerSources.length?'Choose a certificate source':'Load a source first'}</option>${signerSources.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('')}</select>
 <div class="signer-buttons"><button class="btn small soft" type="button" data-action="fetch-cert">${icon('download')} Use selected certificate</button></div>
 <p class="tiny" id="sourceStatus"></p>
 </section>
 <section class="signer-panel"><h3>4. Sign your IPA</h3><div class="signer-buttons"><button class="btn" type="button" id="signerSubmit" data-action="sign-ipa" ${signerBusy?'disabled':''}>${icon('shield')} Sign IPA</button></div>
 <div class="status-line" id="signer-status" aria-live="polite">${signerBusy?'Signing in progress…':'Ready. Connect to your own server first.'}</div>
 <div class="signer-results" id="signerResults">${signerResult ? `<p><b>${esc(signerResult.name)}</b> · ${esc(signerResult.bundleId)}</p><p>Download and install links expire after 15 minutes.</p><div class="signer-buttons"><a class="btn small secondary" href="${esc(signerResult.ipaURL)}">Download signed IPA</a><a class="btn small" href="${esc(signerResult.installURL)}">Install on iPhone</a></div><p class="tiny">OTA installation succeeds only if the certificate is trusted and the profile authorizes your device. Special entitlements and JIT are not added automatically.</p>` : ''}</div>
 </section>`;
}
let fetchedCert = null;
async function readServerError(response) {
 try {const o=await response.json();return typeof o.detail==='string'?o.detail:`HTTP ${response.status}`;}catch{return `HTTP ${response.status}`;}
}
async function checkSigner() {
 try {
   const host=signerUrl(document.getElementById('signerHost').value);
   const response=await fetch(host+'/api/health',{credentials:'omit',cache:'no-store'});
   if(!response.ok)throw new Error('Server HTTP '+response.status);
   const health=await response.json();
   if(!health.signingAvailable)throw new Error('Server is online but zsign is not installed.');
   signerBackend=host; localStorage.setItem('openstore-signer-backend',host);
   signerErr('Signer connected! Now choose the IPA, certificate and provisioning profile.');
 }catch(e){signerErr('Connection failed: '+e.message+' Check HTTPS, server deployment and CORS.');}
}
async function loadCertificateSource() {
 const status=document.getElementById('sourceStatus');
 try {
  const url=safeHttpsUrl(document.getElementById('certificateSource').value);
  if(!url)throw new Error('Certificate source URL must use HTTPS');
  const response=await fetch(url,{cache:'no-store',credentials:'omit'});
  if(!response.ok)throw new Error('Source HTTP '+response.status);
  const body=await response.text();if(body.length>60000)throw new Error('Source file too large');
  const json=JSON.parse(body);if(!Array.isArray(json.certificates)||json.certificates.length>50)throw new Error('Source must contain a certificates array (max 50)');
  signerSources=json.certificates.filter(x=>x && typeof x.name==='string' && safeHttpsUrl(x.p12URL) && safeHttpsUrl(x.profileURL)).map(x=>({name:x.name.slice(0,120),p12URL:x.p12URL,profileURL:x.profileURL}));
  document.getElementById('certChoice').innerHTML='<option value="">Choose a certificate</option>'+signerSources.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');
  status.textContent=`Loaded ${signerSources.length} certificate entries. Verify the source owner before using any certificate.`;
 }catch(e){status.textContent=e.message+'; you can still choose local files manually.';}
}
async function fetchPublicCertificate(){
 const status=document.getElementById('sourceStatus');
 try {
   const idx=document.getElementById('certChoice').value;if(idx==='')throw new Error('Select a certificate');
   const item=signerSources[Number(idx)];if(!item)throw new Error('Certificate not found');
   status.textContent='Downloading certificate files via Safari…';
   const [a,b]=await Promise.all([fetch(item.p12URL,{credentials:'omit'}),fetch(item.profileURL,{credentials:'omit'})]);
   if(!a.ok||!b.ok)throw new Error('Source refused a certificate download');
   const [ab,bb]=await Promise.all([a.blob(),b.blob()]);
   if(ab.size>512*1024 || bb.size>2*1024*1024)throw new Error('Certificate files are unusually large');
   fetchedCert={p12:new File([ab],'shared.p12'),profile:new File([bb],'shared.mobileprovision'),name:item.name};
   status.textContent=`${item.name} loaded in memory. Enter its password, choose IPA and sign. No certificate files are saved by this website.`;
 }catch(e){fetchedCert=null;status.textContent=e.message+' (CORS may block browser downloads). You can download the files directly to Files instead.';}
}
async function signIPA() {
 if(signerBusy)return;
 const status=document.getElementById('signer-status');
 const submit=document.getElementById('signerSubmit');
 let host, key;
 try {host=signerUrl(document.getElementById('signerHost').value);key=document.getElementById('signerToken').value.trim();
  if(!key)throw new Error('Enter your signer backend access key.');
  const ipa=document.getElementById('signerIPA').files?.[0];
  const p12=document.getElementById('signerP12').files?.[0]||fetchedCert?.p12;
  const profile=document.getElementById('signerProfile').files?.[0]||fetchedCert?.profile;
  if(!ipa || !p12 || !profile)throw new Error('Choose IPA, P12, and matching .mobileprovision files.');
  if(ipa.size>250*1024*1024)throw new Error('IPA must be under 250 MB');
  signerBusy=true;submit.disabled=true;signerResult=null;
  document.getElementById('signerResults').textContent='';
  status.textContent='Uploading files and signing. Do not leave this page yet…';
  const form=new FormData();form.append('ipa',ipa,ipa.name);form.append('p12',p12,p12.name);form.append('profile',profile,profile.name);form.append('password',document.getElementById('signerPassword').value);
  const response=await fetch(host+'/api/sign',{method:'POST',headers:{'X-OpenStore-Key':key},body:form,credentials:'omit'});
  if(!response.ok)throw new Error(await readServerError(response));
  const out=await response.json();
  if(!out.ok||!safeHttpsUrl(out.ipaURL)||!safeHttpsUrl(out.manifestURL))throw new Error('Signing server returned an invalid download link');
  signerBackend=host;localStorage.setItem('openstore-signer-backend',host);
  signerResult={name:String(out.name||'App'),bundleId:String(out.bundleId||''),ipaURL:out.ipaURL,installURL:'itms-services://?action=download-manifest&url='+encodeURIComponent(out.manifestURL)};
  status.textContent='Signing completed. Download or install within 15 minutes.';
  document.getElementById('signerResults').innerHTML=`<p><b>${esc(signerResult.name)}</b> · ${esc(signerResult.bundleId)}</p><div class="signer-buttons"><a class="btn small secondary" href="${esc(signerResult.ipaURL)}">Download signed IPA</a><a class="btn small" href="${esc(signerResult.installURL)}">Install on iPhone</a></div><p class="tiny">Your device must be included in the provisioning profile. iOS may still reject revoked certificates or missing entitlements.</p>`;
 }catch(e){status.textContent='Signing failed: '+e.message;
 }finally{signerBusy=false;if(submit)submit.disabled=false;}
}
document.addEventListener('click',event=>{
 const act=event.target.closest('[data-action]')?.dataset.action;
 if(act==='check-signer')checkSigner();
 if(act==='load-certs')loadCertificateSource();
 if(act==='fetch-cert')fetchPublicCertificate();
 if(act==='sign-ipa')signIPA();
});

render();


</script>
